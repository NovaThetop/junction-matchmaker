<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matchmaking · Junction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#171717; --card:#232323; --item:#2b2b2b; --item-border:#3c3c3c; --active:#333333;
  --divider:#2e2e2e; --green:#78ce8d; --green-text:#66ad77; --hl:#1c211d; --rule:#3e5944;
  --text:#ffffff; --soft:#eaeaea; --muted:#8e908e; --label:#a2a2a2; --danger:#e8806f;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Montserrat,system-ui,sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--green)}
.app{display:flex;min-height:100vh}

/* sidebar — mirrors the platform dashboard */
.side{width:240px;flex:none;border-right:1px solid var(--divider);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{text-align:center;padding:26px 0 8px}
.brand small{display:block;letter-spacing:.38em;font-size:11px;color:var(--label);font-weight:600}
.brand b{display:block;font-size:20px;font-weight:700;margin-top:6px}
.navlabel{text-align:center;letter-spacing:.22em;font-size:11px;color:var(--label);font-weight:600;margin:26px 0 8px}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 12px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:6px;color:var(--soft);text-decoration:none;font-size:14.5px}
.nav a.on{background:var(--active);color:#fff}
.nav a:not(.on):hover{background:#202020}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.new{margin-left:auto;font-size:10px;font-weight:700;background:var(--green);color:#000;border-radius:99px;padding:1px 7px}
.me{margin-top:auto;border-top:1px solid var(--divider);padding:14px 16px;display:flex;align-items:center;gap:10px;font-size:14px}
.me small{display:block;color:var(--muted);font-size:12px}

/* main */
main{flex:1;min-width:0;padding:30px 36px 60px;max-width:1180px}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
h1{font-size:32px;font-weight:800;margin:0;letter-spacing:-.01em}
.timer{margin-left:auto;border:1px solid var(--rule);background:var(--hl);color:var(--green);border-radius:99px;padding:8px 18px;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;margin:22px 0 22px;border-bottom:1px solid var(--divider);overflow-x:auto}
.tabs a{padding:10px 14px;color:var(--label);text-decoration:none;font-weight:600;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a.on{color:#fff;border-color:var(--green)}
.badge{display:inline-block;min-width:18px;text-align:center;background:var(--green);color:#000;border-radius:99px;font-size:11px;padding:0 5px;margin-left:5px;font-weight:700}

.card{background:var(--card);border-radius:12px;padding:24px}
.card.hl{background:var(--hl);border:1.5px solid var(--green)}
.card h2{margin:0 0 4px;font-size:22px;font-weight:700}
.card h3{margin:0;font-size:17px;font-weight:700}
.sub{color:var(--muted);margin:0}
.green{color:var(--green)}
.item{background:var(--item);border:1px solid var(--item-border);border-radius:10px;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.section-title{font-size:13px;letter-spacing:.18em;color:var(--label);font-weight:600;text-transform:uppercase;margin:0 0 10px}

.btn{background:var(--green);color:#000;border:0;border-radius:6px;padding:10px 18px;font-weight:600;cursor:pointer;font-size:14px}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--soft);border:1px solid var(--item-border)}
.btn.ghost:hover{border-color:var(--muted)}
.btn.small{padding:7px 13px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:default;filter:none}
.btn.danger{background:transparent;border:1px solid #5a3a35;color:var(--danger)}

.pill{display:inline-block;border-radius:99px;padding:3px 11px;font-size:12.5px;font-weight:600;background:#333;color:var(--soft)}
.pill.g{background:var(--green);color:#000}
.pill.o{background:transparent;border:1px solid var(--rule);color:var(--green)}
.pill.want{background:transparent;border:1px dashed #5f6b62;color:var(--soft)}
.pill.want.hit{border:1px solid var(--green);color:var(--green)}
.compat{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:700;border:1px dashed #4a4f4b;color:var(--muted);white-space:nowrap}
.compat.on{border:0;background:var(--green);color:#000}
.reasons{margin:8px 0 0;padding-left:18px;color:var(--soft);font-size:13px}

.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:#3a3a3a;color:#fff;flex:none}
.av.me{background:#2c5a37;color:var(--green)}
.avs{display:flex}.avs .av{width:30px;height:30px;font-size:12px;border:2px solid var(--item);margin-left:-8px}.avs .av:first-child{margin-left:0}
.kv{font-size:13px;color:var(--muted);margin:10px 0 5px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.links a,.links span{font-size:12.5px;color:var(--green-text);text-decoration:none;border:1px solid var(--divider);border-radius:6px;padding:3px 9px}
.links a:hover{border-color:var(--rule)}

/* forms */
label{display:block;font-weight:600;font-size:13.5px;margin:0 0 6px}
.hint{color:var(--muted);font-weight:400;font-size:12.5px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=url],textarea,select{
  width:100%;background:#1b1b1b;border:1px solid var(--item-border);border-radius:8px;padding:11px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--green)}
textarea{min-height:76px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.field{margin-bottom:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--item-border);background:#1b1b1b;border-radius:99px;padding:7px 13px;cursor:pointer;font-size:13.5px;display:inline-flex;gap:7px;align-items:center}
.chip:hover{border-color:var(--muted)}
.chip.on{background:var(--hl);border-color:var(--green);color:var(--green)}
.chip .n{background:var(--green);color:#000;border-radius:50%;width:18px;height:18px;display:grid;place-items:center;font-size:11px;font-weight:800}
.slot{border:1.5px dashed #4a4f4b;border-radius:10px;padding:16px 18px;color:var(--muted);font-size:13.5px}
.slot b{color:var(--soft)}
.err{color:var(--danger);font-size:13px;margin-top:6px}
.choice{cursor:pointer;text-align:left;border:1.5px solid var(--item-border);background:var(--item);border-radius:12px;padding:22px}
.choice:hover{border-color:var(--muted)}
.choice.on{border-color:var(--green);background:var(--hl)}
.choice h3{margin:10px 0 6px}
.choice .ic{font-size:26px}

/* chat */
.chat{display:flex;flex-direction:column;height:min(70vh,640px)}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:6px 2px 14px}
.msg{max-width:72%;background:var(--item);border:1px solid var(--item-border);border-radius:12px;padding:9px 13px}
.msg.mine{align-self:flex-end;background:var(--hl);border-color:var(--rule)}
.msg small{display:block;color:var(--muted);font-size:11.5px;margin-bottom:2px}
.msg.sys{align-self:center;background:none;border:0;color:var(--green);font-size:13px;font-weight:600}
.composer{display:flex;gap:10px;border-top:1px solid var(--divider);padding-top:14px}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
.toast{position:fixed;right:22px;bottom:22px;background:var(--hl);border:1.5px solid var(--green);color:#fff;border-radius:10px;padding:12px 16px;max-width:360px;box-shadow:0 8px 30px #0008;z-index:9;animation:in .2s ease-out}
@keyframes in{from{transform:translateY(10px);opacity:0}}
.item.declined{opacity:.55}
.nope{margin-top:12px;padding-top:12px;border-top:1px solid var(--divider)}
.prediction{margin-top:14px}
.pred{border:1.5px dashed var(--rule);border-radius:10px;padding:16px 18px;margin-top:14px}
.pred .lbl{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pred .big{font-size:20px;font-weight:700;margin:6px 0 10px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tl li{border-left:2px solid var(--rule);padding-left:12px;font-size:13.5px;color:var(--soft)}
.tl b{color:var(--green);font-variant-numeric:tabular-nums;margin-right:6px}
.heads{margin-top:12px;background:#2a2620;border:1px solid #4d4434;border-radius:8px;padding:10px 12px;font-size:13.5px;color:#f0dfb8}
.times{display:flex;gap:10px;align-items:center}
.times input{width:auto}
.back{color:var(--label);text-decoration:none;font-size:14px;display:inline-block;margin-bottom:14px}
.back:hover{color:#fff}

@media (max-width:860px){
  .side{display:none}
  main{padding:20px 16px 50px}
  h1{font-size:26px}
  .timer{margin-left:0}
  .f2,.f3{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  .msg{max-width:88%}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><small>HACKATHON</small><b>Junction</b></div>
    <div class="navlabel">GENERAL</div>
    <nav class="nav">
      <a><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Dashboard</a>
      <a><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.5 3.2-5.5 6.5-5.5s6 2 6.5 5.5"/><path d="M16 4.8a3.3 3.3 0 0 1 0 6.4M18.5 14.8c1.8.8 2.8 2.6 3 5.2"/></svg>Team</a>

</div>

<!-- 🔌 SPOILERS plug-in (compatibility + simulated weekends). Paste the URL here; it defines window.JunctionMatch. -->
<script>window.SPOILERS_URL = '';</script>
<script>if (window.SPOILERS_URL) document.write('<script src="' + window.SPOILERS_URL + '"><\/script>');</script>
<script>
/* ==========================================================================
   🔌 COMPATIBILITY ANALYSIS — plug-in point for the analysis feature.
   Replace these two functions. Until then the UI shows "analysing…".
     analyzeProfile(user)              -> Promise<any>   (built from GitHub / LinkedIn / project links)
     compatibility(soloUserId, teamId) -> Promise<{ score: 0-100, reasons: string[] } | null>
     simulate(soloUserId, teamId)      -> Promise<{ label, shippedRuns, totalRuns, soloRole, spoiler: [{time, who, what}], headsUp }>  (optional)
   ========================================================================== */
window.JunctionMatch = window.JunctionMatch || {
  analyzeProfile: async (user) => null,
  compatibility: async (soloUserId, teamId) => null,
};

const ROLES = ['Frontend','Backend','Full-stack','Designer','ML / AI','Data','Mobile','Hardware','Product / PM','Pitch & business'];
const SKILLS = ['React','TypeScript','Python','Node.js','Figma','PyTorch','SQL','Flutter','Swift','Arduino','C++','Docker','FastAPI','Next.js','Rust','Go','Pandas','LLMs','Unity','Pitching'];
const INTERESTS = ['AI','health','climate','fintech','gaming','hardware','space','mobility','education','security','music','social impact','robotics','defense','energy','food'];
const KEY = 'junction_matchmaking_v2';
// values for the "Use demo profile" button — Silas sends the real ones
const DEMO_PROFILE = {
  name: 'Silas Wang', email: 'silas@example.com',
  roles: ['Backend', 'ML / AI', 'Full-stack'], skills: ['Python', 'LLMs', 'FastAPI'],
  interests: ['AI', 'education', 'social impact'], awake: { from: '09:00', to: '01:00' },
  linkedin: '', github: 'github.com/s1laswang', other: [],
};

/* ---------- demo data ---------- */
function seed() {
  const users = {}, teams = {};
  const u = (id, name, roles, skills, handle, interests, awake) => users[id] = {
    id, name, roles, skills, interests, awake, mode: 'solo', teamId: null, demo: true,
    links: { linkedin: 'linkedin.com/in/' + handle, github: 'github.com/' + handle, other: [] },
  };
  const t = (id, name, bio, members, lookingFor, openSpots) => {
    teams[id] = { id, name, bio, memberIds: members, lookingFor, openSpots };
    members.forEach(m => { users[m].teamId = id; users[m].mode = openSpots > 0 ? 'team_open' : 'team_full'; });
  };
  // team members
  u('aino','Aino Virtanen',['Frontend','Designer','Product / PM'],['React','Figma','TypeScript'],'aino-demo',['education','AI'],{from:'08:00',to:'23:00'});
  u('mikko','Mikko Laine',['Backend','Data','Full-stack'],['Python','FastAPI','SQL'],'mikko-demo',['education','AI','gaming'],{from:'10:00',to:'02:00'});
  u('sara','Sara Nieminen',['Data','ML / AI','Backend'],['Pandas','Python','SQL'],'sara-demo',['mobility','climate'],{from:'07:00',to:'22:00'});
  u('jonas','Jonas Berg',['Backend','Full-stack','Hardware'],['Go','Docker','Node.js'],'jonas-demo',['mobility','energy','hardware'],{from:'08:00',to:'23:30'});
  u('leo','Leo Korhonen',['Hardware','Mobile','Backend'],['Arduino','C++','Swift'],'leo-demo',['hardware','health','robotics'],{from:'11:00',to:'03:00'});
  u('emma','Emma Lindqvist',['Mobile','Frontend','Designer'],['Flutter','Figma','TypeScript'],'emma-demo',['health','social impact'],{from:'10:00',to:'02:00'});
  u('noor','Noor Haddad',['Designer','Product / PM','Pitch & business'],['Figma','Pitching','React'],'noor-demo',['food','climate','social impact'],{from:'09:00',to:'00:00'});
  u('ville','Ville Mäkinen',['ML / AI','Data','Backend'],['PyTorch','LLMs','Python'],'ville-demo',['AI','mobility','space'],{from:'12:00',to:'04:00'});
  u('anna','Anna Koskinen',['Backend','Full-stack','Data'],['Rust','SQL','Docker'],'anna-demo',['security','mobility'],{from:'13:00',to:'04:00'});
  u('tom','Tom Weber',['Data','ML / AI','Frontend'],['Pandas','SQL','React'],'tom-demo',['AI','fintech'],{from:'11:00',to:'03:00'});
  u('elias','Elias Heikkinen',['Full-stack','Frontend','Backend'],['Next.js','Node.js','TypeScript'],'elias-demo',['social impact','education'],{from:'08:00',to:'00:00'});
  u('maya','Maya Patel',['Product / PM','Pitch & business','Designer'],['Pitching','Figma','SQL'],'maya-demo',['social impact','health','music'],{from:'07:30',to:'23:00'});
  u('rasmus','Rasmus Ek',['Backend','ML / AI','Full-stack'],['Python','Docker','LLMs'],'rasmus-demo',['health','AI'],{from:'09:00',to:'01:00'});
  u('julia','Julia Salo',['Frontend','Designer','Mobile'],['React','Figma','Flutter'],'julia-demo',['health','music'],{from:'09:00',to:'01:00'});
  u('omar','Omar Aziz',['Pitch & business','Product / PM','Data'],['Pitching','SQL','Figma'],'omar-demo',['health','fintech'],{from:'09:00',to:'00:00'});
  t('nebula','Nebula Ninjas','Building an AI study buddy that turns lecture notes into quizzes. Aiming for the EdTech track.',['aino','mikko'],['Designer','ML / AI'],2);
  t('gridlock','Gridlock','Real-time traffic simulation for the Smart City challenge — we have the data pipeline, need someone to make it look good.',['sara','jonas'],['Frontend'],1);
  t('heat','Heat Heroes','A wearable that warns construction workers about heat stress. Hardware works, the app and story don\'t yet.',['leo','emma'],['Backend','Pitch & business'],2);
  t('pantry','Pixel Pantry','Food-waste app for student kitchens: scan what\'s in the fridge, get recipes before it expires.',['noor'],['Frontend','Backend','Mobile'],3);
  t('quokka','Quantum Quokkas','Quantum-inspired route optimiser for delivery bikes. Strong on algorithms, weak on UI.',['ville','anna','tom'],['Designer'],1);
  t('lights','Northern Lights','Accessible event companion app for the Junction community — live schedule, quiet rooms, buddy system.',['elias','maya'],['ML / AI','Frontend'],2);
  t('byte','Byte Club','Health-data dashboard. Team is complete.',['rasmus','julia','omar'],[],0);
  // solo builders
  u('lina','Lina Ström',['Designer','Frontend','Product / PM'],['Figma','React','Pitching'],'lina-demo',['education','social impact','music'],{from:'08:00',to:'23:00'});
  u('oskar','Oskar Nyström',['Backend','Data','ML / AI'],['Python','FastAPI','SQL'],'oskar-demo',['fintech','AI','energy'],{from:'07:00',to:'22:00'});
  u('priya','Priya Raman',['ML / AI','Data','Backend'],['PyTorch','LLMs','Pandas'],'priya-demo',['AI','health','education'],{from:'12:00',to:'04:00'});
  u('mateo','Mateo García',['Mobile','Frontend','Full-stack'],['Flutter','Swift','TypeScript'],'mateo-demo',['mobility','gaming'],{from:'11:00',to:'03:00'});
  u('helmi','Helmi Rantanen',['Hardware','Backend','Data'],['Arduino','C++','Python'],'helmi-demo',['hardware','robotics','space'],{from:'06:30',to:'21:30'});
  u('chloe','Chloé Martin',['Pitch & business','Product / PM','Designer'],['Pitching','Figma','SQL'],'chloe-demo',['climate','food','social impact'],{from:'09:00',to:'00:30'});
  u('ilkka','Ilkka Hämäläinen',['Full-stack','Backend','Frontend'],['Node.js','Next.js','Docker'],'ilkka-demo',['security','fintech','defense'],{from:'13:00',to:'05:00'});
  u('yara','Yara Haddad',['Data','Frontend','Designer'],['SQL','React','Figma'],'yara-demo',['climate','energy','education'],{from:'08:00',to:'23:00'});
  u('kai','Kai Andersen',['Backend','ML / AI','Hardware'],['Rust','Go','PyTorch'],'kai-demo',['robotics','defense','space'],{from:'10:00',to:'02:30'});
  return { v: 2, users, teams, requests: [], chats: [], messages: [], declined: [], me: null,
           endsAt: Date.now() + (14 * 3600 + 32 * 60 + 7) * 1000 };
}

let S = load();
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 2) return s; } catch (e) {}
  return seed();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + '_' + Math.random().toString(36).slice(2, 9);
const me = () => S.me && S.users[S.me];
const myTeam = () => me() && me().teamId && S.teams[me().teamId];
const initials = n => n.split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const av = (user, cls = '') => `<div class="av ${user.id === S.me ? 'me' : ''} ${cls}" title="${esc(user.name)}">${esc(initials(user.name))}</div>`;
const href = l => /^https?:\/\//i.test(l) ? l : 'https://' + l;
const linkChips = (user) => {
  const all = [];
  if (user.links.linkedin) all.push(['LinkedIn', user.links.linkedin]);
  if (user.links.github) all.push(['GitHub', user.links.github]);
  (user.links.other || []).forEach((l, i) => all.push(['Project ' + (i + 1), l]));
  if (!all.length) return '';
  // demo people get non-clickable links so we never point at real strangers' profiles
  return `<div class="links">${all.map(([k, l]) => user.demo
    ? `<span title="${esc(l)}">${k}</span>`

};

function toast(text) {
  const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = text;

// compatibility placeholder, filled asynchronously by window.JunctionMatch
const compat = (soloId, teamId) => `<span class="compat" data-solo="${soloId}" data-team="${teamId}" title="Compatibility analysis coming soon">◌ analysing…</span>`;
async function fillCompat() {
  for (const el of document.querySelectorAll('.compat[data-solo]')) {
    let r = null;
    try { r = await window.JunctionMatch.compatibility(el.dataset.solo, el.dataset.team); } catch (e) {}
    if (!el.isConnected) return; // page re-rendered meanwhile
    if (r && typeof r.score === 'number') {
      el.className = 'compat on'; el.textContent = Math.round(r.score) + '% match';
      const card = el.closest('.item'); if (card) card.dataset.score = r.score;
      if (r.reasons?.length) {
        const box = el.closest('.item')?.querySelector('.why');
        if (box) box.innerHTML = `<ul class="reasons">${r.reasons.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
      }
    }
  }
  sortGrids();
}
// lists are sorted by compatibility score, highest first (cards without a score keep their order at the end)
function sortGrids() {
  for (const grid of document.querySelectorAll('.grid')) {
    const cards = [...grid.children];
    if (!cards.some(c => c.dataset.score !== undefined)) continue;
    cards.map((c, i) => [c, i])
      .sort((a, b) => (+(b[0].dataset.score ?? -1)) - (+(a[0].dataset.score ?? -1)) || a[1] - b[1])
      .forEach(([c]) => grid.appendChild(c));
  }
  applyLimits();
}
// solo team list: show the top few; "Show others" reveals lower-ranked and hidden ("Not for me") teams
function applyLimits() {
  for (const grid of document.querySelectorAll('.grid[data-limit]')) {
    const limit = +grid.dataset.limit; let shown = 0, more = 0;
    for (const c of grid.children) {
      const visible = draft.showOthers || (!c.classList.contains('declined') && shown < limit);
      c.style.display = visible ? '' : 'none';
      if (visible && !c.classList.contains('declined')) shown++;
      if (!visible) more++;
    }
    const btn = document.querySelector('[data-act=showOthers]');
    if (btn) { btn.textContent = draft.showOthers ? 'Show fewer' : `Show others (${more})`; btn.style.display = draft.showOthers || more ? '' : 'none'; }
  }
}

/* ---------- requests & chat logic ---------- */
// one Request type covers both directions: join_request (solo → team) and invite (team → solo)
function findReq(soloId, teamId) {
  return S.requests.find(r => r.soloId === soloId && r.teamId === teamId && r.status === 'pending');
}
function sendRequest(kind, soloId, teamId) {
  if (findReq(soloId, teamId)) return;
  const req = { id: uid('r'), kind, soloId, teamId, status: 'pending', at: Date.now() };
  S.requests.push(req); save();
  const other = kind === 'invite' ? S.users[soloId].name : S.teams[teamId].name;
  toast(kind === 'invite' ? `Invite sent to <b>${esc(other)}</b>` : `Request sent to <b>${esc(other)}</b>`);
  // demo: the other side (sample data) answers by itself after a moment
  setTimeout(() => {
    const r = S.requests.find(x => x.id === req.id);
    if (r && r.status === 'pending') accept(r.id, true);
  }, 2600);
  render();
}
function accept(reqId, byOtherSide = false) {
  const r = S.requests.find(x => x.id === reqId); if (!r || r.status !== 'pending') return;
  const solo = S.users[r.soloId], team = S.teams[r.teamId];
  if (team.openSpots <= 0 || solo.teamId) {
    r.status = 'declined'; save(); toast(team.openSpots <= 0 ? `${esc(team.name)} is already full.` : `${esc(solo.name)} already joined a team.`); render(); return;
  }
  r.status = 'accepted';
  team.memberIds.push(solo.id); team.openSpots -= 1;
  team.lookingFor = team.lookingFor.filter(role => !solo.roles.slice(0, 1).includes(role));
  solo.teamId = team.id;
  team.memberIds.forEach(id => S.users[id].mode = team.openSpots > 0 ? 'team_open' : 'team_full');
  // the solo is no longer solo: close their other pending requests
  S.requests.forEach(x => { if (x.soloId === solo.id && x.status === 'pending') x.status = 'withdrawn'; });
  const chat = { id: uid('c'), teamId: team.id, soloId: solo.id, at: Date.now(), replied: false };
  S.chats.push(chat);
  S.messages.push({ id: uid('m'), chatId: chat.id, senderId: null, text: `${solo.name} joined ${team.name} 🎉 Say hi!`, at: Date.now() });
  save();
  const who = byOtherSide ? (r.kind === 'invite' ? solo.name : team.name) : null;
  toast(`${who ? `<b>${esc(who)}</b> accepted! ` : 'Accepted! '}Chat opened — <a href="#/chat/${chat.id}">open chat →</a>`);
  demoReply(chat.id, 1200);
  render();
}
function decline(reqId) {
  const r = S.requests.find(x => x.id === reqId); if (!r) return;
  r.status = 'declined'; save(); render();
}
function counterpart(chat) {
  // who "the other side" is from my point of view
  if (chat.soloId === S.me) return S.users[S.teams[chat.teamId].memberIds.find(id => id !== S.me)];
  return S.users[chat.soloId];
}
const REPLIES = [
  'Hey! Great to have you 🙌 What part do you want to start with?',
  'Nice! We\'re at the table next to the coffee on Floor 2 — come find us.',
  'Awesome. Can you share your GitHub handle so I can add you to the repo?',
  'Perfect timing, we were just about to split up tasks.',
];
function demoReply(chatId, delay = 1300) {
  const chat = S.chats.find(c => c.id === chatId);
  if (!chat || chat.replied) return;
  const other = counterpart(chat);
  if (!other || !other.demo) return;
  chat.replied = true; save();
  setTimeout(() => {
    S.messages.push({ id: uid('m'), chatId, senderId: other.id, text: REPLIES[S.chats.indexOf(chat) % REPLIES.length], at: Date.now() });
    save(); if (location.hash === '#/chat/' + chatId) render();
    else toast(`New message from <b>${esc(other.name)}</b> — <a href="#/chat/${chatId}">open chat →</a>`);
  }, delay);
}
function myChats() {
  const m = me(); if (!m) return [];
  return S.chats.filter(c => c.soloId === S.me || c.teamId === m.teamId);
}
// requests are seen from my side: as the solo (invites to me / my join requests) or as a team member
function incoming() {
  const m = me(); if (!m) return [];
  return S.requests.filter(r => (r.kind === 'invite' && r.soloId === S.me) ||
    (r.kind === 'join_request' && m.teamId && r.teamId === m.teamId && r.soloId !== S.me));
}
function outgoing() {
  const m = me(); if (!m) return [];
  return S.requests.filter(r => (r.kind === 'join_request' && r.soloId === S.me) ||
    (r.kind === 'invite' && m.teamId && r.teamId === m.teamId && r.soloId !== S.me));
}
// gives the demo something in the inbox right after choosing a mode
function seedIncoming() {
  const m = me();
  if (m.mode === 'solo') {
    const open = Object.values(S.teams).filter(t => t.openSpots > 0 && t.id !== m.teamId);
    const t = open.find(t => t.lookingFor.some(r => m.roles.includes(r))) || open[0];
    if (t) S.requests.push({ id: uid('r'), kind: 'invite', soloId: S.me, teamId: t.id, status: 'pending', at: Date.now() });
  } else if (m.mode === 'team_open') {
    const team = myTeam();
    const solos = Object.values(S.users).filter(u => u.mode === 'solo' && u.id !== S.me);
    const s = solos.find(u => u.roles.some(r => team.lookingFor.includes(r))) || solos[0];
    if (s) S.requests.push({ id: uid('r'), kind: 'join_request', soloId: s.id, teamId: team.id, status: 'pending', at: Date.now() });
  }
}

    <div class="card hl" style="margin-bottom:18px">
      <div class="spread">
        <div><div class="row"><h2>${esc(team.name)}</h2><span class="pill g">${team.openSpots ? `${team.openSpots} spot${team.openSpots === 1 ? '' : 's'} open` : 'Full'}</span></div>
          <p style="margin:8px 0 0;color:var(--soft)">${esc(team.bio)}</p></div>
        ${canJoin ? (req ? `<button class="btn" disabled>${req.kind === 'invite' ? 'Invited you — see Requests' : 'Request sent'}</button>` : `<button class="btn" data-act="join" data-v="${team.id}">Request to join</button>`) : ''}
      </div>
      <div class="kv" style="margin-top:16px">Looking for</div>
      <div class="row">${team.lookingFor.map(r => `<span class="pill want ${m.roles.includes(r) ? 'hit' : ''}">${esc(r)}</span>`).join('') || '<span class="sub">—</span>'}</div>
      ${m.mode === 'solo' ? `<div style="margin-top:14px">${compat(S.me, team.id)}</div>
      <div class="prediction" data-solo="${S.me}" data-team="${team.id}">${predictionHtml(S.me, team.id)}</div>` : ''}
    </div>
    <p class="section-title">Members</p>
    <div class="grid">${team.memberIds.map(uid => personCard(S.users[uid])).join('')}</div>`;
}

// SPOILERS: an AI persona of the solo test-drives 4 simulated hackathon weekends with this team
function predictionHtml(soloId, teamId) {
  const key = soloId + '|' + teamId, r = simCache[key];
  if (!window.JunctionMatch.simulate) return `<div class="slot" style="margin-top:4px"><b>Test-drive 4 weekends</b> — simulation plug-in not loaded yet.</div>`;
  if (r === 'loading') return `<button class="btn" disabled>Simulating 4 weekends…</button>`;
  if (!r || r === 'error') return `<button class="btn ghost" data-act="simulate" data-solo="${soloId}" data-team="${teamId}">Test-drive 4 weekends</button>${r === 'error' ? '<div class="err">Simulation failed — try again.</div>' : ''}`;
  return `<div class="pred">
    <div class="lbl">AI-simulated weekend: a prediction, not a fact</div>
    <div class="big">Shipped in ${esc(r.shippedRuns)} of ${esc(r.totalRuns || 4)} simulated weekends</div>
    ${r.label || r.soloRole ? `<p class="sub" style="margin:-4px 0 12px">${esc(r.label || '')}${r.label && r.soloRole ? ' · ' : ''}${r.soloRole ? 'you as ' + esc(r.soloRole) : ''}</p>` : ''}
    ${r.spoiler?.length ? `<ul class="tl">${r.spoiler.map(x => `<li><b>${esc(x.time)}</b>${x.who ? `<span style="color:#fff;font-weight:600">${esc(x.who)}</span> — ` : ''}${esc(x.what)}</li>`).join('')}</ul>` : ''}
    ${r.headsUp ? `<div class="heads">⚠ ${esc(r.headsUp)}</div>` : ''}
  </div>`;
}
async function runSimulation(soloId, teamId) {
  const key = soloId + '|' + teamId;
  const paint = () => { const el = document.querySelector(`.prediction[data-solo="${soloId}"][data-team="${teamId}"]`); if (el) el.innerHTML = predictionHtml(soloId, teamId); };
  simCache[key] = 'loading'; paint();
  try { simCache[key] = (await window.JunctionMatch.simulate(soloId, teamId)) || 'error'; } catch (e) { simCache[key] = 'error'; }
  paint();
}

function reqRow(r, isIncoming) {
  const solo = S.users[r.soloId], team = S.teams[r.teamId];
  const m = me();
  const asSolo = r.soloId === S.me;
  const title = asSolo
    ? `<b>${esc(team.name)}</b> ${r.kind === 'invite' ? 'invited you to join' : '— you asked to join'}`
    : `<b>${esc(solo.name)}</b> ${r.kind === 'join_request' ? 'wants to join your team' : '— you invited them'}`;
  const sub = asSolo
    ? `${esc(team.bio)}`
    : `${solo.roles.map(esc).join(' · ')} — ${solo.skills.map(esc).join(', ')}`;
  const chat = r.status === 'accepted' && S.chats.find(c => c.soloId === r.soloId && c.teamId === r.teamId);
  const status = {
    pending: isIncoming
      ? `<button class="btn ghost small" data-act="decline" data-v="${r.id}">Decline</button><button class="btn small" data-act="accept" data-v="${r.id}">Accept</button>`
      : '<span class="pill">Waiting…</span>',
    accepted: `<span class="pill g">Accepted</span>${chat ? `<a class="btn small" style="text-decoration:none" href="#/chat/${chat.id}">Open chat</a>` : ''}`,
    declined: '<span class="pill">Declined</span>',
    withdrawn: '<span class="pill">Closed — you joined another team</span>',
  }[r.status];
  return `<div class="item spread" style="align-items:center"><div class="row" style="flex-wrap:nowrap">${av(asSolo ? { id: team.id, name: team.name } : solo)}<div><div>${title}</div><p class="sub" style="font-size:13px">${sub}</p></div></div><div class="row" style="flex:none">${status}</div></div>`;
}

function viewRequests() {
  const inc = incoming().slice().reverse(), out = outgoing().slice().reverse();
  return tabs('requests') + `
    <p class="section-title">Incoming</p>
    <div class="stack" style="margin-bottom:28px">${inc.length ? inc.map(r => reqRow(r, true)).join('') : '<div class="card empty">Nothing yet.</div>'}</div>
    <p class="section-title">Sent</p>
    <div class="stack">${out.length ? out.map(r => reqRow(r, false)).join('') : '<div class="card empty">You haven\'t sent anything yet — go to Browse.</div>'}</div>
    <p class="sub" style="margin-top:22px;font-size:12.5px">Demo: the sample builders and teams answer your requests automatically.</p>`;
}

function chatTitle(c) {
  return `${S.teams[c.teamId].name} ↔ ${S.users[c.soloId].name}`;
}
function viewChats() {
  const list = myChats().slice().reverse();
  return tabs('chats') + (list.length ? `<div class="stack">${list.map(c => {
    const last = S.messages.filter(x => x.chatId === c.id).pop();
    return `<a class="item spread" href="#/chat/${c.id}" style="text-decoration:none;color:inherit;align-items:center">
      <div class="row" style="flex-wrap:nowrap">${av(counterpart(c) || S.users[c.soloId])}<div><b>${esc(chatTitle(c))}</b><p class="sub" style="font-size:13px">${esc(last ? last.text : '')}</p></div></div><span class="green">→</span></a>`;
  }).join('')}</div>` : '<div class="card empty">No chats yet. A chat opens as soon as an invite or join request is accepted.</div>');
}
function viewChat(id) {
  const c = S.chats.find(x => x.id === id);
  if (!c || !myChats().includes(c)) return tabs('chats') + '<div class="card empty">Chat not found.</div>';
  const msgs = S.messages.filter(x => x.chatId === id);
  return tabs('chats') + `
    <a class="back" href="#/chats">← All chats</a>
    <div class="card chat">
      <div class="spread" style="border-bottom:1px solid var(--divider);padding-bottom:14px;margin-bottom:8px">
        <div><h3>${esc(chatTitle(c))}</h3><p class="sub" style="font-size:13px">${S.teams[c.teamId].memberIds.map(x => esc(S.users[x].name.split(' ')[0])).join(', ')}</p></div>
        <a class="btn ghost small" href="#/team/${c.teamId}" style="text-decoration:none">View team</a>
      </div>
      <div class="msgs" id="msgs">${msgs.map(x => x.senderId === null
        ? `<div class="msg sys">${esc(x.text)}</div>`
        : `<div class="msg ${x.senderId === S.me ? 'mine' : ''}"><small>${esc(S.users[x.senderId].name)}</small>${esc(x.text)}</div>`).join('')}</div>
      <form class="composer" id="composer" data-chat="${c.id}">
        <input type="text" name="text" placeholder="Write a message…" autocomplete="off" required>
        <button class="btn" type="submit">Send</button>
      </form>
    </div>`;
}

function viewProfile() {
  const m = me(), team = myTeam();
  const modeLabel = { solo: 'Solo — looking for a team', team_open: 'Team — looking for builders', team_full: 'Team — full' }[m.mode];
  return tabs('profile') + `
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
      <div class="stack">${personCard(m)}
        <div class="slot"><b>Compatibility profile — coming soon.</b> Built from your GitHub, LinkedIn and project links.</div></div>
      <div class="stack">
        <div class="item"><div class="kv" style="margin-top:0">Status</div><h3>${modeLabel}</h3>
          ${team ? `<p class="sub" style="margin-top:6px">Team: <a href="#/team/${team.id}">${esc(team.name)}</a></p>` : ''}
        </div>
        <div class="item"><div class="kv" style="margin-top:0">Demo</div>
          <p class="sub" style="margin-bottom:12px">Sample builders and teams answer automatically. Start over to try the other path.</p>
          <button class="btn danger small" data-act="reset">Start over</button></div>
      </div>
    </div>`;
}

/* ---------- router ---------- */
function render() {
  const m = me();
  $('#meChip').innerHTML = m
    ? `${av(m)}<div>${esc(m.name)}<small>${esc(m.email || '')}</small></div>`
    : `<div class="av">?</div><div>Not signed in<small>Create a profile</small></div>`;
  const h = location.hash.replace(/^#\/?/, '');
  const [route, arg] = h.split('/');
  let html;
  if (!m) html = viewSignup();
  else if (!m.mode || route === 'mode') html = viewMode();
  else if (route === 'team') html = viewTeam(arg);
  else if (route === 'requests') html = viewRequests();
  else if (route === 'chats') html = viewChats();
  else if (route === 'chat') html = viewChat(arg);
  else if (route === 'profile') html = viewProfile();
  else html = viewBrowse();
  $('#view').innerHTML = html;
  const msgs = $('#msgs'); if (msgs) msgs.scrollTop = msgs.scrollHeight;
  applyLimits();
  fillCompat();
}
window.addEventListener('hashchange', () => { draft.err = ''; render(); window.scrollTo(0, 0); });

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const v = b.dataset.v, m = me();
  switch (b.dataset.act) {
    case 'role': {
      const i = draft.roles.indexOf(v);
      if (i >= 0) draft.roles.splice(i, 1); else if (draft.roles.length < 3) draft.roles.push(v);
      return keepForm('#signup');
    }
    case 'interest': {
      const i = draft.interests.indexOf(v);
      if (i >= 0) draft.interests.splice(i, 1); else draft.interests.push(v);
      return keepForm('#signup');
    }
    case 'demoProfile': {
      const p = DEMO_PROFILE;
      draft.roles = p.roles.slice(); draft.interests = p.interests.slice(); draft.err = '';
      render();
      const f = $('#signup'), set = (n, val) => { if (f.elements[n]) f.elements[n].value = val; };
      set('name', p.name); set('email', p.email); set('password', 'demo-password-not-stored');
      p.skills.forEach((x, i) => set('skill' + (i + 1), x));
      set('awakeFrom', p.awake.from); set('awakeTo', p.awake.to);
      set('linkedin', p.linkedin); set('github', p.github); set('other', (p.other || []).join('\n'));
      return;
    }
    case 'nope': draft.nopeFor = draft.nopeFor === v ? null : v; return render();
    case 'nopeReason':
      S.declined = S.declined.filter(x => x.teamId !== v);
      S.declined.push({ teamId: v, reason: b.dataset.r, at: Date.now() });
      draft.nopeFor = null; save(); toast('Hidden. Use <b>Show others</b> to see it again.'); return render();
    case 'undoNope': S.declined = S.declined.filter(x => x.teamId !== v); save(); return render();
    case 'showOthers': draft.showOthers = !draft.showOthers; return applyLimits();
    case 'simulate': return runSimulation(b.dataset.solo, b.dataset.team);
    case 'want': {
      const i = draft.lookingFor.indexOf(v);
      if (i >= 0) draft.lookingFor.splice(i, 1); else draft.lookingFor.push(v);
      return keepForm('#teamForm');
    }
    case 'mode': draft.mode = v; draft.err = ''; return keepForm('#teamForm');
    case 'goSolo':
      m.mode = 'solo'; seedIncoming(); save(); location.hash = '#/browse'; return render();
    case 'onlyMine': draft.onlyMine = !draft.onlyMine; return render();
    case 'join': return sendRequest('join_request', S.me, v);
    case 'invite': return sendRequest('invite', v, m.teamId);
    case 'accept': return accept(v);
    case 'decline': return decline(v);
    case 'reopen': {
      const t = myTeam(); t.openSpots = 1; t.memberIds.forEach(id => S.users[id].mode = 'team_open');
      save(); return render();
    }
    case 'reset':
      if (confirm('Start over? This clears your demo profile, requests and chats.')) {
        S = seed(); save(); draft = { roles: [], interests: [], lookingFor: [], mode: null, err: '', showOthers: false, nopeFor: null }; location.hash = '#/'; render();
      }
      return;
  }
});
// re-render without losing what's typed into the form
function keepForm(sel) {
  const f = $(sel), vals = {};
  if (f) for (const el of f.elements) if (el.name) vals[el.name] = el.value;
  render();
  const g = $(sel);
  if (g) for (const el of g.elements) if (el.name && vals[el.name] !== undefined) el.value = vals[el.name];
}

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, d = Object.fromEntries(new FormData(f));
  if (f.id === 'signup') {
    if (draft.roles.length !== 3) { draft.err = 'Pick exactly 3 preferred roles.'; return keepForm('#signup'); }
    const skills = [d.skill1, d.skill2, d.skill3].map(s => s.trim());
    if (skills.some(s => !s)) { draft.err = 'Add 3 skills.'; return keepForm('#signup'); }
    const id = 'me';
    // demo only: the password is never stored
    S.users[id] = {
      id, name: d.name.trim(), email: d.email.trim(), roles: draft.roles.slice(), skills,
      interests: draft.interests.slice(), awake: { from: d.awakeFrom, to: d.awakeTo },
      links: { linkedin: d.linkedin.trim(), github: d.github.trim(), other: d.other.split('\n').map(s => s.trim()).filter(Boolean) },
      mode: null, teamId: null,
    };
    S.me = id; draft.err = ''; save();
    window.JunctionMatch.analyzeProfile(S.users[id]).catch(() => {});
    location.hash = '#/mode'; render();
  } else if (f.id === 'teamForm') {
    const open = draft.mode === 'team_open';
    if (open && !draft.lookingFor.length) { draft.err = 'Pick at least one role you\'re looking for.'; return keepForm('#teamForm'); }
    const m = me(), tid = 't_' + S.me;
    S.teams[tid] = { id: tid, name: d.tname.trim(), bio: d.bio.trim(), memberIds: [S.me], lookingFor: open ? draft.lookingFor.slice() : [], openSpots: open ? +d.spots : 0 };
    m.teamId = tid; m.mode = draft.mode; draft.err = '';
    seedIncoming(); save(); location.hash = '#/browse'; render();
  } else if (f.id === 'composer') {
    const text = d.text.trim(); if (!text) return;
    S.messages.push({ id: uid('m'), chatId: f.dataset.chat, senderId: S.me, text, at: Date.now() });
    save(); render(); $('#composer input')?.focus();
    demoReply(f.dataset.chat);
  }
});

/* ---------- countdown ---------- */
function tick() {
  let s = Math.max(0, Math.floor((S.endsAt - Date.now()) / 1000));
  const p = n => String(n).padStart(2, '0');
  $('#timer').textContent = `Hacking ends in ${p(Math.floor(s / 3600))}:${p(Math.floor(s / 60) % 60)}:${p(s % 60)}`;
}
setInterval(tick, 1000); tick();
render();
</script>
</body>
</html>
